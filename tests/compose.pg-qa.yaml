name: skillhub-pg-qa
services:
  app:
    image: skillhub:pg-candidate
    init: true
    environment:
      SKILLHUB_DATABASE_URL: postgresql://skillhub_app:${SKILLHUB_QA_PG_APP_PASSWORD:?Dedicated test password required}@skillhub-postgres:5432/skillhub
    depends_on:
      skillhub-postgres: {condition: service_healthy}
    networks: [qa]
    labels: {skillhub-purpose: pg-migration-qa}
  skillhub-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: skillhub_admin
      POSTGRES_PASSWORD: ${SKILLHUB_QA_PG_ADMIN_PASSWORD:?Dedicated test password required}
      SKILLHUB_APP_PASSWORD: ${SKILLHUB_QA_PG_APP_PASSWORD:?Dedicated test password required}
    volumes:
      - qa-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [qa]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U skillhub_admin -d skillhub"]
      interval: 2s
      timeout: 5s
      retries: 30
    labels: {skillhub-purpose: pg-migration-qa}
networks:
  qa:
    internal: true
    labels: {skillhub-purpose: pg-migration-qa}
volumes:
  qa-data:
    labels: {skillhub-purpose: pg-migration-qa}
